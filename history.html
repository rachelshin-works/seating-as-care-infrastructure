<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>history — seating as care infrastructure</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
    <script type="importmap">
      {
        "imports": {
          "three": "./node_modules/three/build/three.module.js",
          "three/addons/": "./node_modules/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body class="page-history">
    <div class="line-model-wrap" aria-hidden="true">
      <canvas id="line-model"></canvas>
    </div>

    <main class="history-main">
      <article class="history" id="history-content" aria-label="history writing">
        <p class="history__status">loading…</p>
      </article>
    </main>

    <div class="sidebar sidebar--fixed">
      <h1 class="site-title">
        undocumented sittings:<br />
        infrastructure for care
      </h1>

      <nav class="dock" aria-label="views">
        <a class="dock__tab is-active" data-view="history" href="history.html"
          >history</a
        >
        <a class="dock__tab" data-view="map" href="index.html">map</a>
        <a class="dock__tab" data-view="archive" href="archive.html">archive</a>
      </nav>
    </div>

    <script type="module" src="js/line-model.js"></script>
    <script src="js/history.js"></script>
  </body>
</html>
