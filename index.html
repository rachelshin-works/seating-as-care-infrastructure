<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>seating as care infrastructure</title>
    <link
      href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body>
    <div id="map"></div>

    <aside class="heat-legend" aria-label="color range filter">
      <div class="heat-legend__labels">
        <span>documented</span>
        <span>undocumented</span>
      </div>
      <div class="heat-legend__bar" aria-hidden="true"></div>
      <div class="heat-legend__slider">
        <input
          type="range"
          id="heat-min"
          min="0"
          max="4"
          step="1"
          value="0"
          aria-label="range min"
        />
        <input
          type="range"
          id="heat-max"
          min="0"
          max="4"
          step="1"
          value="4"
          aria-label="range max"
        />
      </div>
      <div class="heat-legend__values">
        <span id="heat-min-label"></span>
        <span id="heat-max-label"></span>
      </div>
    </aside>

    <aside
      class="seat-popup is-hidden"
      id="seat-popup"
      hidden
      aria-label="seat details"
    >
      <button type="button" class="seat-popup__close" aria-label="close">
        ×
      </button>
      <dl class="seat-popup__list">
        <div class="seat-popup__row">
          <dt>type</dt>
          <dd id="seat-popup-type">—</dd>
        </div>
        <div class="seat-popup__row">
          <dt id="seat-popup-category-label">bench</dt>
          <dd id="seat-popup-category">—</dd>
        </div>
        <div class="seat-popup__row">
          <dt>lng</dt>
          <dd id="seat-popup-lng">—</dd>
        </div>
        <div class="seat-popup__row">
          <dt>lat</dt>
          <dd id="seat-popup-lat">—</dd>
        </div>
        <div class="seat-popup__row">
          <dt id="seat-popup-date-label">installed date</dt>
          <dd id="seat-popup-date">—</dd>
        </div>
      </dl>
    </aside>

    <div class="sidebar">
      <h1 class="site-title">
        undocumented sittings:<br />
        infrastructure for care
      </h1>

      <aside
        class="panel"
        id="map-panel"
        aria-label="sitting survey form"
      >
        <header class="panel__header">
          <h2 class="panel__title">collective map</h2>
          <button type="button" class="panel__close" aria-label="minimize">
            −
          </button>
        </header>

        <form class="panel__form" id="seat-form">
          <div class="field-row">
            <label class="field">
              <span class="field__label">lng</span>
              <input
                class="field__input"
                id="field-lng"
                name="longitude"
                type="text"
                inputmode="decimal"
                placeholder="click map or locate"
                value=""
              />
            </label>
            <label class="field">
              <span class="field__label">lat</span>
              <input
                class="field__input"
                id="field-lat"
                name="latitude"
                type="text"
                inputmode="decimal"
                placeholder="click map or locate"
                value=""
              />
            </label>
          </div>
          <button type="button" class="locate-btn" id="locate-btn">
            locate me
          </button>

          <fieldset class="field">
            <legend class="field__label">category</legend>
            <div class="tabs">
              <label class="tab">
                <input
                  type="radio"
                  name="category"
                  value="portable-chair"
                  checked
                />
                <span>portable chair</span>
              </label>
              <label class="tab">
                <input type="radio" name="category" value="staircase" />
                <span>staircase</span>
              </label>
              <label class="tab">
                <input
                  type="radio"
                  name="category"
                  value="building-infrastructures"
                />
                <span>building infrastructures</span>
              </label>
              <label class="tab">
                <input
                  type="radio"
                  name="category"
                  value="building-scaffolding"
                />
                <span>building scaffolding</span>
              </label>
              <label class="tab">
                <input type="radio" name="category" value="cars" />
                <span>cars</span>
              </label>
            </div>
          </fieldset>

          <fieldset class="field">
            <legend class="field__label">rate</legend>
            <div class="rate">
              <label class="rate__option">
                <input type="radio" name="rate" value="0" />
                <span>0</span>
              </label>
              <label class="rate__option">
                <input type="radio" name="rate" value="1" />
                <span>1</span>
              </label>
              <label class="rate__option">
                <input type="radio" name="rate" value="2" checked />
                <span>2</span>
              </label>
              <label class="rate__option">
                <input type="radio" name="rate" value="3" />
                <span>3</span>
              </label>
              <label class="rate__option">
                <input type="radio" name="rate" value="4" />
                <span>4</span>
              </label>
              <label class="rate__option">
                <input type="radio" name="rate" value="5" />
                <span>5</span>
              </label>
            </div>
          </fieldset>

          <label class="field field--grow">
            <span class="field__label">comment</span>
            <textarea
              class="field__textarea"
              id="field-comment"
              name="comment"
              rows="4"
              placeholder="describe the sitting condition…"
            ></textarea>
          </label>

          <p class="form-status" id="form-status" aria-live="polite"></p>
          <button class="submit" type="submit">submit</button>
        </form>
      </aside>

      <button
        type="button"
        class="panel-chip is-hidden"
        id="panel-chip"
        aria-label="expand collective map"
        hidden
      >
        <span>collective map</span>
        <span class="panel-chip__arrow" aria-hidden="true">→</span>
      </button>

      <nav class="dock" aria-label="views">
        <button type="button" class="dock__tab" data-view="history">
          history
        </button>
        <button type="button" class="dock__tab is-active" data-view="map">
          map
        </button>
        <a class="dock__tab" data-view="archive" href="archive.html">archive</a>
      </nav>
    </div>

    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script>
      if (typeof maplibregl === "undefined") {
        document.write(
          '<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"><\/script>',
        );
      }
    </script>
    <script src="js/map.js"></script>
    <script src="js/ui.js"></script>
  </body>
</html>
