<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>seating as care infrastructure</title>
    <style>
      html,
      body {
        background: #ffffff;
        color: #01E1E5;
      }
    </style>
    <link href="css/style.css" rel="stylesheet" />
    <link
      href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="map"></div>

    <aside class="axes-filter" aria-label="two axes filter">
      <div class="axes-filter__layout">
        <span class="axes-filter__blank" aria-hidden="true"></span>
        <span class="axes-filter__x-label">individual</span>
        <span class="axes-filter__x-label">public</span>

        <span class="axes-filter__y-label">documented</span>
        <button
          type="button"
          class="axes-filter__cell is-disabled"
          disabled
          aria-label="documented individual — none"
          title="none"
        >
          <span class="axes-filter__swatch"></span>
        </button>
        <button
          type="button"
          class="axes-filter__cell is-active"
          data-cell="doc-public"
          aria-pressed="true"
          aria-label="documented public — benches"
          title="documented benches"
        >
          <span class="axes-filter__swatch axes-filter__swatch--grey"></span>
        </button>

        <span class="axes-filter__y-label">undocumented</span>
        <button
          type="button"
          class="axes-filter__cell is-active"
          data-cell="undoc-individual"
          aria-pressed="true"
          aria-label="undocumented individual — portable chairs, small infrastructure"
          title="portable chairs, small infrastructure"
        >
          <span class="axes-filter__swatch axes-filter__swatch--warm"></span>
        </button>
        <button
          type="button"
          class="axes-filter__cell is-active"
          data-cell="undoc-public"
          aria-pressed="true"
          aria-label="undocumented public — staircase"
          title="staircase"
        >
          <span class="axes-filter__swatch axes-filter__swatch--hot"></span>
        </button>
      </div>
    </aside>

    <aside
      class="seat-popup is-hidden"
      id="seat-popup"
      hidden
      aria-label="seat details"
    >
      <button type="button" class="seat-popup__close" aria-label="close">
        ×
      </button>
      <dl class="seat-popup__list">
        <div class="seat-popup__row">
          <dt>type</dt>
          <dd id="seat-popup-type">—</dd>
        </div>
        <div class="seat-popup__row">
          <dt id="seat-popup-category-label">bench</dt>
          <dd id="seat-popup-category">—</dd>
        </div>
        <div class="seat-popup__row">
          <dt>lng</dt>
          <dd id="seat-popup-lng">—</dd>
        </div>
        <div class="seat-popup__row">
          <dt>lat</dt>
          <dd id="seat-popup-lat">—</dd>
        </div>
        <div class="seat-popup__row">
          <dt id="seat-popup-date-label">installed date</dt>
          <dd id="seat-popup-date">—</dd>
        </div>
      </dl>
    </aside>

    <div class="sidebar">
      <h1 class="site-title">
        <img
          src="assets/title.png"
          alt="undocumented sittings: infrastructure for care"
        />
      </h1>

      <aside
        class="panel is-hidden"
        id="map-panel"
        aria-label="sitting survey form"
        hidden
      >
        <header class="panel__header">
          <h2 class="panel__title">collective map</h2>
          <button type="button" class="panel__close" aria-label="minimize">
            −
          </button>
        </header>

        <form class="panel__form" id="seat-form">
          <div class="field-row">
            <label class="field">
              <span class="field__label">lng</span>
              <input
                class="field__input"
                id="field-lng"
                name="longitude"
                type="text"
                inputmode="decimal"
                placeholder="click map or locate"
                value=""
              />
            </label>
            <label class="field">
              <span class="field__label">lat</span>
              <input
                class="field__input"
                id="field-lat"
                name="latitude"
                type="text"
                inputmode="decimal"
                placeholder="click map or locate"
                value=""
              />
            </label>
          </div>
          <button type="button" class="locate-btn" id="locate-btn">
            locate me
          </button>

          <fieldset class="field">
            <legend class="field__label">category</legend>
            <div class="tabs">
              <label class="tab">
                <input
                  type="radio"
                  name="category"
                  value="portable-chair"
                  checked
                />
                <span>portable chair</span>
              </label>
              <label class="tab">
                <input type="radio" name="category" value="staircase" />
                <span>staircase</span>
              </label>
              <label class="tab">
                <input
                  type="radio"
                  name="category"
                  value="building-infrastructures"
                />
                <span>building infrastructures</span>
              </label>
              <label class="tab">
                <input
                  type="radio"
                  name="category"
                  value="building-scaffolding"
                />
                <span>building scaffolding</span>
              </label>
              <label class="tab">
                <input type="radio" name="category" value="cars" />
                <span>cars</span>
              </label>
            </div>
          </fieldset>

          <fieldset class="field">
            <legend class="field__label">rate</legend>
            <div class="rate">
              <label class="rate__option">
                <input type="radio" name="rate" value="0" />
                <span>0</span>
              </label>
              <label class="rate__option">
                <input type="radio" name="rate" value="1" />
                <span>1</span>
              </label>
              <label class="rate__option">
                <input type="radio" name="rate" value="2" checked />
                <span>2</span>
              </label>
              <label class="rate__option">
                <input type="radio" name="rate" value="3" />
                <span>3</span>
              </label>
              <label class="rate__option">
                <input type="radio" name="rate" value="4" />
                <span>4</span>
              </label>
              <label class="rate__option">
                <input type="radio" name="rate" value="5" />
                <span>5</span>
              </label>
            </div>
          </fieldset>

          <label class="field field--grow">
            <span class="field__label">comment</span>
            <textarea
              class="field__textarea"
              id="field-comment"
              name="comment"
              rows="4"
              placeholder="describe the sitting condition…"
            ></textarea>
          </label>

          <p class="form-status" id="form-status" aria-live="polite"></p>
          <button class="submit" type="submit">submit</button>
        </form>
      </aside>

      <button
        type="button"
        class="panel-chip"
        id="panel-chip"
        aria-label="expand collective map"
      >
        <span>collective map</span>
        <span class="panel-chip__arrow" aria-hidden="true">→</span>
      </button>

      <nav class="dock" aria-label="views">
        <a class="dock__tab" data-view="history" href="history.html">history</a>
        <button type="button" class="dock__tab is-active" data-view="map">
          map
        </button>
        <a class="dock__tab" data-view="archive" href="archive.html">archive</a>
      </nav>
    </div>

    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script>
      if (typeof maplibregl === "undefined") {
        document.write(
          '<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"><\/script>',
        );
      }
    </script>
    <script src="js/map.js"></script>
    <script src="js/ui.js"></script>
  </body>
</html>
